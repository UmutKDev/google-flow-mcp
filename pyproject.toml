[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "google-flow-mcp"
version = "0.1.0"
description = "MCP server for Google Flow (Veo / Omni video, Nano Banana images), built for Obot and any MCP client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Umut" }]
keywords = ["mcp", "google-flow", "veo", "nano-banana", "obot"]
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.58,<2",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
google-flow-mcp = "google_flow_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_flow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]
